name: original-baseline-watch

# Read-only watcher. It compares public upstream release metadata against the
# recorded baseline and opens/updates a single deduplicated tracking issue.
# It does not download or execute the original app and needs no desktop runner.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Which signal to check
        type: choice
        options: [upstream, local]
        default: upstream

permissions:
  contents: read
  issues: write

concurrency:
  group: original-baseline-watch
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare public upstream signals with the recorded baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/watch-original.mjs --upstream --issue
          code=$?
          # 1 means drift, which the tracking issue already carries; keep the run
          # green so a red run unambiguously means the watcher itself is broken.
          if [ "$code" -eq 1 ]; then echo "::notice::Baseline drift detected; tracking issue created or updated."; exit 0; fi
          exit "$code"

  # Public metadata cannot prove that the *installed* baseline changed, so the
  # authoritative hash check stays on a self-hosted macOS runner when available.
  # Enable by setting the repository variable CU_SELF_HOSTED_MACOS=1.
  installed:
    if: vars.CU_SELF_HOSTED_MACOS == '1'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Compare installed app hashes with the recorded baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/watch-original.mjs --local --issue
          code=$?
          if [ "$code" -eq 1 ]; then echo "::notice::Installed baseline drift detected; tracking issue created or updated."; exit 0; fi
          exit "$code"
