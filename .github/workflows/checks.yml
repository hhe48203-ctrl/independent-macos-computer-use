name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pushed branch and its pull request describe the same tree; keep only one run
# per ref so a merge to main does not duplicate the check it already passed.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.command }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            command: check
          - os: macos-15
            command: check:native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ${{ matrix.command }}
      - name: Benchmark harness unit tests
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tests -p 'test_bench_v2_*.py'
